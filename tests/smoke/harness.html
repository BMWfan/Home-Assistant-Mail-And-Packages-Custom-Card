<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mail and Packages Card Harness</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #f2f4f7;
        font-family: "Segoe UI", "Noto Sans", sans-serif;
      }

      #app {
        max-width: 640px;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@lit/reactive-element": "/node_modules/@lit/reactive-element/reactive-element.js",
          "lit-html/": "/node_modules/lit-html/",
          "@lit/reactive-element/": "/node_modules/@lit/reactive-element/",
          "lit-html": "/node_modules/lit-html/lit-html.js",
          "lit-element/lit-element.js": "/node_modules/lit-element/lit-element.js"
        }
      }
    </script>
    <script type="module">
      import { LitElement, html, css } from "/node_modules/lit/index.js";
      LitElement.prototype.html = html;
      LitElement.prototype.css = css;
      customElements.define("hui-view", class extends LitElement {});

      const haTags = [
        "ha-card",
        "ha-icon",
        "ha-dialog",
        "ha-textfield",
        "ha-switch",
        "ha-icon-button",
      ];
      for (const tag of haTags) {
        if (!customElements.get(tag)) {
          customElements.define(tag, class extends HTMLElement {});
        }
      }

      await import("/dist/Home-Assistant-Mail-And-Packages-Custom-Card.js");

      const CardCtor = customElements.get("mail-and-packages-card");
      window.__serviceCalls = [];

      window.mountCard = (fixture, config = {}) => {
        const app = document.getElementById("app");
        app.innerHTML = "";

        const hass = structuredClone(fixture);
        hass.callService = (...args) => {
          window.__serviceCalls.push(args);
        };

        const card = new CardCtor();
        card.setConfig(config);
        card.hass = hass;
        app.append(card);
        card.requestUpdate();
        window.__card = card;

        return card.updateComplete.then(() => ({ mounted: true }));
      };
    </script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
